services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    # Direct host ports removed to prevent conflicts when running multiple projects.
    # Access MinIO via Nginx or Cloudflare Tunnel.
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py ensure_bucket && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Direct host ports removed to prevent conflicts when running multiple projects.
    # Access Backend via Nginx (http://localhost/api or api-alorchoya.newsmartagent.com)
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    command: sh -c 'npm install --no-audit --no-fund && if [ "${FRONTEND_MODE:-development}" = production ]; then npm run build && npm run start; else npm run dev; fi'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      # Server Components run inside this container, where `localhost` is not Django.
      INTERNAL_API_URL: http://backend:8000/api
      FRONTEND_MODE: ${FRONTEND_MODE:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    # Direct host ports removed to prevent conflicts when running multiple projects.
    # Access Frontend via Nginx (http://localhost or alorchoya.newsmartagent.com)
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - frontend
      - backend
      - minio

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
